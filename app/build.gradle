plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qianwang.privatewealth'
    compileSdk 35

    defaultConfig {
        applicationId 'com.qianwang.privatewealth'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.9.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Reuse the offline builder's identity so Android Studio builds can update it.
    def localKey = rootProject.file('.local/signing/guilong-debug.p12')
    def localPassword = rootProject.file('.local/signing/password.txt')
    if (localKey.exists() && localPassword.exists()) {
        signingConfigs {
            localDebug {
                storeFile localKey
                storePassword localPassword.text.trim()
                keyAlias 'guilong-debug'
                keyPassword localPassword.text.trim()
                storeType 'PKCS12'
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.localDebug
            }
            // The release may only use the existing private signing identity.
            release {
                signingConfig signingConfigs.localDebug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Standalone JVM checks use synthetic data and do not touch an Android ledger.
def domainClasses = layout.buildDirectory.dir('domain-check/classes')
def domainSources = [
    'WealthStore.java', 'AssetSankey.java', 'AssetTree.java',
    'DisplayMoney.java', 'DailyChangeText.java', 'QuoteClient.java', 'BackupCodec.java'
].collect { file("src/main/java/com/qianwang/privatewealth/${it}") }
def domainTests = [
    rootProject.file('scripts/WealthDomainTests.java'),
    rootProject.file('tests/AssetsV6Test.java'),
    rootProject.file('tests/AssetSankeyTest.java'),
    rootProject.file('tests/QuoteBackupTest.java')
]
tasks.register('compileDomainChecks', JavaCompile) {
    source(domainSources + domainTests)
    classpath = files(provider { android.bootClasspath })
    destinationDirectory = domainClasses
    options.encoding = 'UTF-8'
    sourceCompatibility = '8'
    targetCompatibility = '8'
}
[
    'wealthDomainCheck': 'com.qianwang.privatewealth.WealthDomainTests',
    'assetsV6Check': 'com.qianwang.privatewealth.AssetsV6Test',
    'sankeyCheck': 'com.qianwang.privatewealth.AssetSankeyTest',
    'quoteBackupCheck': 'QuoteBackupTest'
].each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        dependsOn 'compileDomainChecks'
        classpath = files(domainClasses, provider { android.bootClasspath })
        mainClass = entryPoint
    }
}
tasks.register('domainCheck') {
    group = 'verification'
    description = 'Run synthetic JVM domain, Sankey, quote and backup checks.'
    dependsOn 'wealthDomainCheck', 'assetsV6Check', 'sankeyCheck', 'quoteBackupCheck', 'ledgerStorageCheck'
}

// Execute the actual ledger/JSON paths with isolated JVM filesystem doubles.
// This dependency and tests/jvm are not part of the APK or Android source sets.
configurations {
    ledgerTestJson {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    ledgerTestJson 'org.json:json:20240303'
}
def ledgerTestClasses = layout.buildDirectory.dir('ledger-storage-check/classes')
tasks.register('compileLedgerStorageChecks', JavaCompile) {
    source([
        file('src/main/java/com/qianwang/privatewealth/WealthStore.java'),
        file('src/main/java/com/qianwang/privatewealth/DisplayMoney.java'),
        file('src/main/java/com/qianwang/privatewealth/AssetSankey.java'),
        file('src/main/java/com/qianwang/privatewealth/DailyChangeText.java'),
        file('src/main/java/com/qianwang/privatewealth/AssetCalendar.java'),
        file('src/main/java/com/qianwang/privatewealth/NavigationLayout.java'),
        rootProject.file('tests/NavigationLayoutTest.java'),
        rootProject.file('tests/AssetCalendarTest.java'),
        rootProject.file('scripts/WealthDomainTests.java'),
        rootProject.file('tests/IncomeSourcesTest.java')
    ] + rootProject.fileTree('tests/jvm') { include '**/*.java' }.files)
    classpath = configurations.ledgerTestJson
    destinationDirectory = ledgerTestClasses
    options.encoding = 'UTF-8'
    sourceCompatibility = '8'
    targetCompatibility = '8'
}
tasks.register('ledgerStorageCheck', JavaExec) {
    group = 'verification'
    description = 'Check income, daily sources, migrations and failed writes in isolated JVM files.'
    dependsOn 'compileLedgerStorageChecks'
    classpath = files(ledgerTestClasses, configurations.ledgerTestJson)
    mainClass = 'com.qianwang.privatewealth.IncomeSourcesTest'
}

tasks.register('calendarCheck', JavaExec) {
    group = 'verification'
    description = 'Check monthly boundaries and calendar record gaps.'
    dependsOn 'compileLedgerStorageChecks'
    classpath = files(ledgerTestClasses, configurations.ledgerTestJson)
    mainClass = 'com.qianwang.privatewealth.AssetCalendarTest'
}
tasks.named('domainCheck') { dependsOn 'calendarCheck' }

tasks.register('navigationCheck', JavaExec) {
    group = 'verification'
    description = 'Check navigation order and icon identity.'
    dependsOn 'compileLedgerStorageChecks'
    classpath = files(ledgerTestClasses, configurations.ledgerTestJson)
    mainClass = 'com.qianwang.privatewealth.NavigationLayoutTest'
}
tasks.named('domainCheck') { dependsOn 'navigationCheck' }
