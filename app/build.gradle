plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qianwang.privatewealth'
    compileSdk 35

    defaultConfig {
        applicationId 'com.qianwang.privatewealth'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.7.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Reuse the offline builder's identity so Android Studio builds can update it.
    def localKey = rootProject.file('.local/signing/guilong-debug.p12')
    def localPassword = rootProject.file('.local/signing/password.txt')
    if (localKey.exists() && localPassword.exists()) {
        signingConfigs {
            localDebug {
                storeFile localKey
                storePassword localPassword.text.trim()
                keyAlias 'guilong-debug'
                keyPassword localPassword.text.trim()
                storeType 'PKCS12'
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.localDebug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Standalone JVM checks use synthetic data and do not touch an Android ledger.
def domainClasses = layout.buildDirectory.dir('domain-check/classes')
def domainSources = [
    'WealthStore.java', 'AssetSankey.java', 'AssetTree.java',
    'DisplayMoney.java', 'QuoteClient.java', 'BackupCodec.java'
].collect { file("src/main/java/com/qianwang/privatewealth/${it}") }
def domainTests = [
    rootProject.file('scripts/WealthDomainTests.java'),
    rootProject.file('tests/AssetsV6Test.java'),
    rootProject.file('tests/AssetSankeyTest.java'),
    rootProject.file('tests/QuoteBackupTest.java')
]
tasks.register('compileDomainChecks', JavaCompile) {
    source(domainSources + domainTests)
    classpath = files(provider { android.bootClasspath })
    destinationDirectory = domainClasses
    options.encoding = 'UTF-8'
    sourceCompatibility = '8'
    targetCompatibility = '8'
}
[
    'wealthDomainCheck': 'com.qianwang.privatewealth.WealthDomainTests',
    'assetsV6Check': 'com.qianwang.privatewealth.AssetsV6Test',
    'sankeyCheck': 'com.qianwang.privatewealth.AssetSankeyTest',
    'quoteBackupCheck': 'QuoteBackupTest'
].each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        dependsOn 'compileDomainChecks'
        classpath = files(domainClasses, provider { android.bootClasspath })
        mainClass = entryPoint
    }
}
tasks.register('domainCheck') {
    group = 'verification'
    description = 'Run synthetic JVM domain, Sankey, quote and backup checks.'
    dependsOn 'wealthDomainCheck', 'assetsV6Check', 'sankeyCheck', 'quoteBackupCheck'
}
