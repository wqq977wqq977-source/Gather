name: Publish signed Gather APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - app/build.gradle
      - app/src/main/java/**
      - docs/releases/0.9.6.md
      - scripts/build_apk.py
permissions:
  contents: write
concurrency:
  group: gather-signed-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release policy
        run: |
          jq -e '.validation == "smoke" or .validation == "full"' .github/release-policy.json >/dev/null
          if [[ "$(jq -r .validation .github/release-policy.json)" == "full" ]]; then
            ./gradlew :app:assembleDebug :app:domainCheck
          else
            echo 'Small release: signed build and APK checks only.'
          fi
      - name: Prepare protected original signing identity
        id: signature
        shell: bash
        env:
          GATHER_SIGNING_P12_BASE64: ${{ secrets.GATHER_SIGNING_P12_BASE64 }}
          GATHER_SIGNING_PASSWORD: ${{ secrets.GATHER_SIGNING_PASSWORD }}
        run: |
          if [[ -z "${GATHER_SIGNING_P12_BASE64}" || -z "${GATHER_SIGNING_PASSWORD}" ]]; then
            echo '::error::Original Gather signing secrets are missing. No release will be published. Add GATHER_SIGNING_P12_BASE64 and GATHER_SIGNING_PASSWORD, then rerun this workflow.'
            exit 1
          fi
          umask 077
          mkdir -p .local/signing
          printf '%s' "${GATHER_SIGNING_P12_BASE64}" | base64 --decode > .local/signing/guilong-debug.p12
          printf '%s' "${GATHER_SIGNING_PASSWORD}" > .local/signing/password.txt
          test -s .local/signing/guilong-debug.p12
          test -s .local/signing/password.txt
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signature.outputs.ready == 'true'
        run: ./gradlew :app:assembleRelease
      - name: Verify original certificate, version and checksum
        if: steps.signature.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          original="$RUNNER_TEMP/Gather-0.7.1-release.apk"
          current="app/build/outputs/apk/release/app-release.apk"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/wqq977wqq977-source/Gather/releases/download/v0.7.1/Gather-0.7.1-release.apk" -o "$original"
          printf '%s  %s\n' '52273ba62b6753f2ea88e817ec3cfac255d0f794d6687eb4d7aa83af6e99a733' "$original" | sha256sum --check -
          "$apksigner" verify --verbose --print-certs "$original" > "$RUNNER_TEMP/old-cert.txt"
          "$apksigner" verify --verbose --print-certs "$current" > "$RUNNER_TEMP/new-cert.txt"
          old_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-cert.txt")"
          new_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt")"
          test -n "$old_sha"
          test "$old_sha" = "$new_sha" || { echo '::error::Different signing certificate: update would fail. Publication blocked.'; exit 1; }
          "$aapt" dump badging "$current" | grep -F "versionCode='20' versionName='0.9.6'"
          "$aapt" dump badging "$current" | grep -F "package: name='com.qianwang.privatewealth'"
          unzip -t "$current" > /dev/null
          mkdir -p release-files
          cp "$current" "release-files/Gather-0.9.6-release.apk"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path("release-files/Gather-0.9.6-release.apk")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          (p.parent / "SHA256SUMS.txt").write_text(f"{digest}  {p.name}\n")
          (p.parent / "Gather-0.9.6-release.json").write_text(json.dumps({
              "versionName": "0.9.6", "versionCode": 20, "package": "com.qianwang.privatewealth",
              "sourceCommit": os.environ["GITHUB_SHA"], "sha256": digest,
              "certificateVerifiedAgainst": "v0.7.1"
          }, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Publish only compatible signed APK
        if: steps.signature.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.9.6 >/dev/null 2>&1; then
            echo '::error::v0.9.6 already exists. Refusing to overwrite a published release.'
            exit 1
          fi
          gh release create v0.9.6 release-files/* --target "$GITHUB_SHA" \
            --title 'Gather v0.9.6' --notes-file docs/releases/0.9.6.md --latest
      - name: Remove private signing material
        if: always()
        run: rm -f .local/signing/guilong-debug.p12 .local/signing/password.txt
